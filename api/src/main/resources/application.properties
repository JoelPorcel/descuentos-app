spring.application.name=descuentos-api
server.port=${PORT:8080}

# Solo se expone /actuator/health (lo usan Render y el smoke test)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Origenes que pueden llamar a la API desde un navegador (CORS). Separados por coma; admite comodines.
# En Render se define CORS_ORIGINS con la URL de Vercel.
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

# Commit desplegado: Render lo entrega en RENDER_GIT_COMMIT; en local se puede pasar APP_COMMIT.
app.commit=${RENDER_GIT_COMMIT:${APP_COMMIT:desconocido}}

# --- Practica 10: seguridad ---
# Nunca se devuelven trazas ni mensajes de excepcion al cliente
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
# No anunciar el servidor ni su version
server.server-header=
# /actuator/health sin detalles
management.endpoint.health.show-details=never
# Token de administracion: SOLO por variable de entorno (en Render: Environment). Sin valor, /api/admin queda deshabilitado.
app.admin-token=${ADMIN_TOKEN:}
# Entrada acotada
server.tomcat.max-http-form-post-size=8KB
server.max-http-request-header-size=8KB
